[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.dependencies]
# versions indicative — pin and commit the lockfile, especially tree-sitter grammars
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
thiserror   = "2"
tree-sitter = "0.24"
tokio       = { version = "1", features = ["full"] }
axum        = "0.8"
notify      = "7"
clap        = { version = "4", features = ["derive"] }
tracing     = "0.1"

# Language-specific grammars — pin these tightly
tree-sitter-rust = "0.23"