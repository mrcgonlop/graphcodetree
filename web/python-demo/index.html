<!DOCTYPE html>
<html lang="en">
<head>
<!-- ── Python demo ─────────────────────────────────────────────────────────
     The same viewer as `web/refactor/`, pointed at a different snapshot: the
     `graph.json` next to this file is an extract of a real Python checkout
     (agx-emulsion), not of this Rust repo. Only the asset references differ —
     they point one folder up, at `../refactor/` — because `main.js` fetches
     `graph.json` relative to the *page*. The markup below is deliberately a
     copy: `.cgtest/python-demo.mjs` parses both pages and fails if their
     control declarations drift apart. Where the original writes its
     multiplication sign, magnifier icon or ballot X glyphs this page spells
     them as entities, so a console round-trip cannot mangle them.
     ──────────────────────────────────────────────────────────────────────── -->
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CodeGraph Snapshot &mdash; Python (agx-emulsion)</title>
<script src="https://unpkg.com/cytoscape/dist/cytoscape.min.js"></script>
<link rel="stylesheet" href="../refactor/style.css" />
</head>
<body>


<div id="sidebar">
  <header>
    <h1>&#x2B21; CodeGraph</h1>
    <p>Python snapshot &mdash; agx-emulsion</p>
    <div id="stats">Loading&hellip;</div>
  </header>
  <div id="filters"></div>
  <div id="depth-selector"></div>



  <details id="pipeline-panel" class="panel" closed>
    <summary>View &mdash; what the boxes are</summary>
    <div class="ctrl-group">
      <label>Detail</label>
      <select id="detail-select">
        <option value="full">folder &rarr; file &rarr; symbol</option>
        <option value="files">file &rarr; symbol</option>
        <option value="flat">flat (symbols only)</option>
      </select>
    </div>
    <div class="ctrl-group">
      <label style="min-width:auto"><input type="checkbox" id="native-labels" /> Native labels (zoom&#8209;scaled)</label>
    </div>
    <div class="ctrl-group">
      <label style="min-width:auto"><input type="checkbox" id="show-lines" /> Line numbers on labels</label>
    </div>
  </details>

  <details id="params-panel" class="panel" closed>
    <summary>Layout parameters</summary>

    <div id="font-slider">
      <label>Text size</label>
      <input type="range" id="font-range" min="6" max="24" value="10" step="1" />
      <span id="font-val">10</span>
    </div>
    <div id="graph-controls">
      <div class="ctrl-group">
        <label>Node size</label>
        <input type="range" id="node-size-range" min="8" max="80" value="40" step="1" />
        <span id="node-size-val">40</span>
      </div>
      <div class="ctrl-group">
        <label>File pad</label>
        <input type="range" id="pad-range" min="4" max="60" value="15" step="1" />
        <span id="pad-val">15</span>
      </div>
      <div class="ctrl-group">
        <label>Folder pad</label>
        <input type="range" id="folder-pad-range" min="4" max="80" value="20" step="1" />
        <span id="folder-pad-val">20</span>
      </div>
      <div class="ctrl-actions">
        <button id="reset-view-btn" class="ctrl-btn">Reset View</button>
        <button id="relayout-btn" class="ctrl-btn">Re&#8209;layout</button>
      </div>
    </div>
    <div class="param-group">Tree geometry &mdash; containment packing</div>
    <div class="ctrl-group">
      <label>Node gap X</label>
      <input type="range" id="hier-nodegapx-range" min="0" max="80" value="24" step="2" />
      <span id="hier-nodegapx-val">24</span>
    </div>
    <div class="ctrl-group">
      <label>Node gap Y</label>
      <input type="range" id="hier-nodegapy-range" min="0" max="80" value="28" step="2" />
      <span id="hier-nodegapy-val">28</span>
    </div>

    <div class="ctrl-group">
      <label>Column gap</label>
      <input type="range" id="hier-colgap-range" min="0" max="160" value="36" step="4" />
      <span id="hier-colgap-val">36</span>
    </div>
    <div class="ctrl-group">
      <label>Row gap</label>
      <input type="range" id="hier-rowgap-range" min="0" max="240" value="64" step="4" />
      <span id="hier-rowgap-val">64</span>
    </div>
    <div class="ctrl-group">
      <label>Block aspect</label>
      <input type="range" id="hier-aspect-range" min="0.6" max="3" value="1.7" step="0.05" />
      <span id="hier-aspect-val">1.7</span>
    </div>
    <div class="ctrl-group">
      <label>Outer pad</label>
      <input type="range" id="layoutpad-range" min="0" max="200" value="30" step="5" />
      <span id="layoutpad-val">30</span>
    </div>
    <div class="ctrl-actions">
      <button class="ctrl-btn preset-btn" data-preset="tree (compact)">tree compact</button>
      <button class="ctrl-btn preset-btn" data-preset="tree (roomy)">tree roomy</button>
    </div>
    <div class="ctrl-actions">
      <button id="reset-params-btn" class="ctrl-btn">Reset params</button>
    </div>
  </details>

  <div id="search-box">
    <div class="search-wrap">
      <input type="text" id="search" placeholder="Filter nodes by name&hellip;" />
      <button class="clear-btn" data-target="search" tabindex="-1">&times;</button>
    </div>
    <div class="search-wrap">
      <input type="text" id="search-path" placeholder="Filter by file path&hellip;" list="path-list" />
      <button class="clear-btn" data-target="search-path" tabindex="-1">&times;</button>
    </div>
    <datalist id="path-list"></datalist>
  </div>
  <div id="focus-indicator">
    <span>&#x1F50D; Focus: </span><span id="focus-label"></span>
    <span class="dir-legend"><i class="dir-out"></i>outgoing <i class="dir-in"></i>incoming</span>
    <span class="focus-dismiss" title="Show all nodes">&#x2715;</span>
  </div>
  <div id="node-details">
    <div class="empty">Click a node to see details</div>
  </div>
</div>
<div id="graph-container"></div>

<!-- Two ways this page ends up as "a sidebar over an empty canvas", both of which
     look like a broken graph rather than a loading problem:
       1. a `file://` origin — browsers run neither ES modules nor fetch() there,
          so the module script below never executes at all;
       2. a server rooted at the page's own folder — this page loads its code from
          a sibling folder (`../refactor/…`) and its data from next to itself, so
          only the repository root serves both (the asset just 404s).
     Case 1 is detectable immediately. Case 2 only shows up as "nothing ever
     started", which is what the timer below watches for: main.js writes #stats
     as soon as the snapshot arrives, so "Loading…" still being there means it
     never got that far. Both cases print the command that fixes them.
     (Kept byte-identical to the copy on web/refactor/index.html;
     .cgtest/python-demo.mjs checks that.) -->
<script>
function cgPageDir() {
    return (location.pathname.match(/\/web\/.*$/) || ['/web/'])[0].replace(/index\.html$/, '');
}
function cgBootHint() {
    var stats = document.getElementById('stats');
    var details = document.getElementById('node-details');
    if (!stats || !details) return;
    if (stats.textContent.indexOf('Loading') !== 0) return;   // it booted after all
    details.innerHTML =
        '<div class="empty">The viewer never started: its module script or ' +
        '<code>graph.json</code> did not load.<br><br>This page takes its code from a ' +
        'sibling folder and its data from next to itself, so it needs a server rooted ' +
        'at the repository root:<br><code>python -m http.server 8000</code> ' +
        '(no <code>--directory web/python-demo</code>)<br>then open ' +
        '<code>http://localhost:8000' + cgPageDir() + '</code><br><br>' +
        'F12 &rarr; Console names the exact request that failed.</div>';
}
if (location.protocol === 'file:') {
    document.getElementById('stats').innerHTML = 'file:// origin &mdash; nothing was loaded';
    document.getElementById('node-details').innerHTML =
        '<div class="empty">Browsers refuse to run ES modules or <code>fetch()</code> from a ' +
        '<code>file://</code> origin, so the viewer never booted and <code>graph.json</code> ' +
        'was never requested.<br><br>Serve the repository instead:<br>' +
        '<code>python -m http.server 8000</code><br>and open ' +
        '<code>http://localhost:8000' + cgPageDir() + '</code></div>';
} else {
    setTimeout(cgBootHint, 4000);
}
</script>
<script type="module" src="../refactor/app/main.js"></script>
</body>
</html>
